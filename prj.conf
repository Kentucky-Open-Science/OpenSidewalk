CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_LORAMAC_NODE=y
CONFIG_LORAWAN=y
CONFIG_LORAWAN_REGION_US915=y
CONFIG_LORAWAN_NVM_NONE=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_NVS_DATA_CRC=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_USE_DT_CODE_PARTITION=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="kg100s> "
CONFIG_SHELL_ECHO_STATUS=n
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_VT100_COMMANDS=n
CONFIG_SHELL_HISTORY=n
CONFIG_SHELL_CMD_BUFF_SIZE=160
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_REBOOT=y
CONFIG_BOOT_BANNER=y
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_BT=n
CONFIG_SENSOR=y
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y
